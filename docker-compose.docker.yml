services:
  docker-daemon-init:
    profiles: ["docker"]
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command:
      - sh
      - -lc
      - mkdir -p /run/user/1000 && chown -R 1000:1000 /run/user/1000 && chmod 700 /run/user/1000
    networks:
      - agent_net
    volumes:
      - shared_dind_sock:/run/user/1000
    restart: "no"

  docker-daemon:
    profiles: ["docker"]
    container_name: ai-sandbox-docker-daemon
    image: ${DOCKER_DIND_IMAGE:-docker:28-dind-rootless@sha256:7c3e797187e43738220462658f4586572cbd3bf009f728b21e34d9c5c06ce431}
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun
    depends_on:
      proxy:
        condition: service_healthy
      docker-daemon-init:
        condition: service_completed_successfully
    environment:
      DOCKER_TLS_CERTDIR: ""
      DOCKERD_ROOTLESS_ROOTLESSKIT_NET: vpnkit
      DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER: builtin
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,proxy,docker-daemon,ai-sandbox-docker-daemon
    command:
      - dockerd
      - --host=unix:///run/user/1000/docker.sock
      - --iptables=false
    healthcheck:
      test: ["CMD-SHELL", "docker --host=unix:///run/user/1000/docker.sock info >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - agent_net
    volumes:
      - shared_dind_data:/home/rootless/.local/share/docker
      - shared_dind_sock:/run/user/1000
    restart: unless-stopped

  claude-agent:
    build:
      target: claude-docker
      args:
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-docker:27-cli}
        HELM_VERSION: ${HELM_VERSION:-v3.18.4}
    image: ${CLAUDE_DOCKER_IMAGE_NAME:-ai-sandbox-claude-agent-docker:local}
    environment:
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      NO_PROXY: localhost,127.0.0.1,proxy,docker-daemon,ai-sandbox-docker-daemon
    volumes:
      - shared_dind_sock:/run/user/1000

  codex-agent:
    build:
      target: codex-docker
      args:
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-docker:27-cli}
        HELM_VERSION: ${HELM_VERSION:-v3.18.4}
    image: ${CODEX_DOCKER_IMAGE_NAME:-ai-sandbox-codex-agent-docker:local}
    environment:
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      NO_PROXY: localhost,127.0.0.1,proxy,docker-daemon,ai-sandbox-docker-daemon
    volumes:
      - shared_dind_sock:/run/user/1000

volumes:
  shared_dind_data:
    name: ai-sandbox-dind-data
    external: true
  shared_dind_sock:
    name: ai-sandbox-dind-sock
    external: true
