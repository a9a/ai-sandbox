name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          bash -n build.sh
          bash -n build-codex.sh
          bash -n scripts/*.sh

      - name: Shellcheck
        run: shellcheck -e SC1091 build.sh build-codex.sh scripts/*.sh

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Rust format check
        run: cargo fmt --manifest-path cli/agent-box/Cargo.toml --check

      - name: Rust check
        run: cargo check --manifest-path cli/agent-box/Cargo.toml --locked

      - name: Rust tests
        run: cargo test --manifest-path cli/agent-box/Cargo.toml --locked

      - name: Validate compose config
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml --profile claude config >/dev/null
          docker compose -f docker-compose.yml --profile codex config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.docker.yml --profile claude config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.docker.yml --profile codex config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.docker.yml -f .ci/docker-compose.agent-box.yml --profile claude --profile codex config >/dev/null
          docker compose -f docker-compose.yml -f .ci/docker-compose.test.yml config >/dev/null

      - name: Build images
        run: |
          docker compose -f docker-compose.yml build proxy
          docker compose -f docker-compose.yml --profile claude build claude-agent
          docker compose -f docker-compose.yml -f docker-compose.docker.yml --profile claude build claude-agent
          docker compose -f docker-compose.yml --profile codex build codex-agent
          docker compose -f docker-compose.yml -f docker-compose.docker.yml --profile codex build codex-agent

      - name: Integration tests (Claude)
        run: ./scripts/test-integration.sh claude

      - name: Integration tests (Codex)
        run: ./scripts/test-integration.sh codex
