services:
  claude-agent:
    extends:
      file: docker-compose.agent.yml
      service: agent
    build:
      target: claude
      args:
        CLAUDE_NODE_IMAGE: ${CLAUDE_NODE_IMAGE:-node:24-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.109}
    image: ${CLAUDE_IMAGE_NAME:-ai-sandbox-claude-agent:local}
    container_name: ai-sandbox-claude-agent
    environment:
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets:
      - source: anthropic_api_key
        target: anthropic_api_key
    volumes:
      - type: bind
        source: ${CLAUDE_HOME_PATH:-${PWD}/.claude}
        target: /home/devops/.claude

secrets:
  anthropic_api_key:
    environment: ANTHROPIC_API_KEY
