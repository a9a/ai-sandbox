services:
  claude-agent:
    depends_on: !reset {}
  codex-agent:
    depends_on: !reset {}
  docker-daemon:
    labels:
      ai-sandbox.mount-config: "ci"
    volumes:
      - type: bind
        source: ${PWD}
        target: /home/devops/project/ci/repository

networks:
  agent_net: !override
    external: true
    name: ai-sandbox_agent_net
