services:
  proxy:
    volumes:
      - ./.ci/allowed-domains.test.txt:/etc/squid/allowed-domains.txt:ro

  tester:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    command: ["sleep", "infinity"]
    depends_on:
      - proxy
      - mock-upstream
      - blocked-upstream
    networks:
      - agent_net

  mock-upstream:
    image: hashicorp/http-echo:1.0.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
    command: ["-listen=:80", "-text=ok-allowed"]
    networks:
      - agent_net

  blocked-upstream:
    image: hashicorp/http-echo:1.0.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
    command: ["-listen=:80", "-text=blocked-should-not-pass"]
    networks:
      - agent_net
